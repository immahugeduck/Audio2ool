name: Node.js CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    # The repo's lockfile is bun.lock (what Vercel installs from). Plain `npm install` without a
    # lockfile hit npm's optional-dependency bug ("Cannot find native binding" from
    # @tailwindcss/oxide), so CI has been red on main since early November.
    - uses: oven-sh/setup-bun@v2

    - name: Build
      run: |
        bun install --frozen-lockfile
        npm run build

    - name: DSP unit tests
      run: npm test
